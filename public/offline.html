<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | E-Bill Book</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px 24px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #fbbf24 0%, #ec4899 50%, #f43f5e 100%);
      margin-bottom: 24px;
      box-shadow: 0 10px 15px -3px rgba(244, 63, 94, 0.3);
    }
    .logo-inner {
      font-weight: 900;
      font-size: 28px;
      color: white;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .alert-badge {
      display: inline-block;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .retry-btn {
      background: linear-gradient(to right, #e11d48, #be123c);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 14px;
      border: none;
      display: inline-block;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
    }
    .retry-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .retry-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <span class="logo-inner">E</span>
    </div>
    <div class="alert-badge">Network Offline</div>
    <h1>Internet Disconnected</h1>
    <p>You are currently offline. E-Bill Book is designed to store invoice records in your secure local device storage. Please check your network and reload to synchronize.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
